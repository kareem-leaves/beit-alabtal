<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>منصة بيت الأبطال</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* التخطيط: صفحة واحدة طويلة بأقسام مرقّمة بالترتيب التعليمي، وألوان الفئات (آحاد/آلاف/ملايين) هي الخيط البصري في كل الصفحة */
:root{
  --bg:#f5f7fb; --card:#ffffff; --fg:#17203a; --muted:#566079; --line:#dde2ee;
  --ones:#3a4fc4; --ones-bg:#e6eafb;
  --thou:#0b7f80; --thou-bg:#dcf2f1;
  --mill:#b8650a; --mill-bg:#fcebd3;
  --ok:#12703a; --ok-bg:#dcf5e6; --bad:#b3261e; --bad-bg:#fde4e1;
  --hl:#ffe9a0; --on-accent:#ffffff;
  --display:"Reem Kufi","Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --card:#172036; --fg:#e7ebf6; --muted:#9aa5c2; --line:#2a3552;
    --ones:#8ea0ff; --ones-bg:#1f2a5a; --thou:#4fd1d2; --thou-bg:#10393b; --mill:#f2a447; --mill-bg:#4a3010;
    --ok:#6fdc9b; --ok-bg:#12351f; --bad:#ff8b82; --bad-bg:#431b18; --hl:#5a4a10; --on-accent:#0e1424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --card:#172036; --fg:#e7ebf6; --muted:#9aa5c2; --line:#2a3552;
  --ones:#8ea0ff; --ones-bg:#1f2a5a; --thou:#4fd1d2; --thou-bg:#10393b; --mill:#f2a447; --mill-bg:#4a3010;
  --ok:#6fdc9b; --ok-bg:#12351f; --bad:#ff8b82; --bad-bg:#431b18; --hl:#5a4a10; --on-accent:#0e1424;
  color-scheme:dark;
}
:root{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.9}
*{box-sizing:border-box}
.wrap{max-width:920px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.5;margin:0}
.eyebrow{font-size:14px;letter-spacing:.04em;color:var(--muted);font-weight:500}
h1{font-size:clamp(34px,7vw,54px);color:var(--ones);margin-top:2px}
.lead{max-width:60ch;color:var(--muted);margin:6px 0 0}
nav.jump{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px;padding:0}
nav.jump a{color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:4px 14px;border-radius:999px;font-weight:500;font-size:15px}
nav.jump a:hover,nav.jump a:focus-visible{border-color:var(--ones);color:var(--ones);outline:none}
section{margin-top:44px}
h2{font-size:clamp(24px,4.5vw,32px);padding-bottom:8px;border-bottom:3px solid var(--ones);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h2 small{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted)}
h3{font-size:21px;margin:22px 0 6px;color:var(--ones)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.card > :first-child{margin-top:0}
.card p{margin:8px 0}
.ex{background:var(--hl);border-radius:8px;padding:8px 14px;margin:10px 0 0}
.real{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.real div{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px}
.real b{display:block;font-family:var(--display);font-size:22px;color:var(--mill)}
.scroll{overflow-x:auto;max-width:100%}
table.pv{direction:ltr;border-collapse:collapse;width:100%;min-width:520px;text-align:center;margin-top:8px}
table.pv th,table.pv td{border:1px solid var(--line);padding:4px 6px;font-variant-numeric:tabular-nums}
table.pv th{font-weight:500;font-size:14px;line-height:1.5}
.g-mill{background:var(--mill-bg);color:var(--mill)}
.g-thou{background:var(--thou-bg);color:var(--thou)}
.g-ones{background:var(--ones-bg);color:var(--ones)}
table.pv .dg td{font-family:var(--display);font-size:30px;height:54px}
table.pv .vl td{font-size:13px;color:var(--muted);height:34px}
table.pv .dg td.z{color:var(--muted);opacity:.7}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tool label{font-weight:700}
input[type=text]{font-family:var(--body);font-size:22px;direction:ltr;text-align:center;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);width:min(100%,240px)}
input[type=text]:focus-visible{outline:3px solid var(--ones);border-color:var(--ones)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.three div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card)}
.three b{color:var(--ones)}
ul.tight{margin:8px 0;padding-inline-start:22px}
ul.tight li{margin:6px 0}
.box{border:2px solid var(--ones);border-radius:12px;padding:6px 20px 12px;background:var(--card)}
.warn{border-inline-start:6px solid var(--mill);background:var(--mill-bg);padding:8px 14px;border-radius:8px;margin:10px 0}
table.plain{border-collapse:collapse;width:100%;min-width:560px;margin-top:10px}
table.plain th,table.plain td{border:1px solid var(--line);padding:8px 12px;text-align:start;vertical-align:top}
table.plain th{background:var(--ones-bg);color:var(--ones);font-weight:700}
td.ans{cursor:pointer;position:relative}
td.ans:not(.on){color:transparent;background:var(--ones-bg);user-select:none}
td.ans:not(.on)::after{content:"اضغط لإظهار الإجابة";color:var(--ones);position:absolute;inset:0;padding:8px 12px;font-size:15px}
td.ans:focus-visible{outline:3px solid var(--ones)}
.btn{font-family:var(--body);font-size:16px;font-weight:700;border:2px solid var(--ones);background:var(--ones);color:var(--on-accent);padding:7px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ones)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;width:0;background:var(--thou);transition:width .3s}
.pill{background:var(--ones-bg);color:var(--ones);font-weight:700;padding:2px 14px;border-radius:99px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.q .qh{display:flex;gap:12px;align-items:flex-start}
.q .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ones);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.q p.qt{margin:0;font-weight:700;font-size:18px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;text-align:start;width:100%;font-family:var(--body);font-size:17px;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ones)}
.opt:focus-visible{outline:3px solid var(--ones)}
.opt .l{font-weight:700;color:var(--ones);min-width:22px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--fg)}
.fb{margin-top:12px;border-radius:10px;padding:8px 14px}
.fb.good{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b.v{font-size:19px}
.fb.good b.v{color:var(--ok)} .fb.bad b.v{color:var(--bad)}
.result{text-align:center;padding:20px}
.result .big{font-family:var(--display);font-size:54px;color:var(--ones);line-height:1.3}
.ws{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.ws .hd{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:6px}
.ws ol{padding-inline-start:26px;margin:10px 0}
.ws li{margin:12px 0;padding-inline-start:4px}
.blank{display:inline-block;min-width:130px;border-bottom:2px solid var(--fg);height:1.2em;vertical-align:bottom}
.key li{margin:8px 0}
.key .num{color:var(--ok);font-weight:700}
.slide{aspect-ratio:16/9;max-width:100%;background:var(--ones);color:var(--on-accent);border-radius:14px;padding:clamp(12px,3vw,26px);display:flex;flex-direction:column;justify-content:space-between;margin-top:12px}
.slide .st{font-family:var(--display);font-size:clamp(20px,4.5vw,36px);line-height:1.4}
.slide .ss{font-size:clamp(13px,2.4vw,18px);opacity:.92}
.slide .chips{display:flex;direction:ltr;gap:6px;justify-content:center}
.slide .chips span{font-family:var(--display);background:rgba(255,255,255,.18);border-radius:8px;padding:0 clamp(8px,2vw,16px);font-size:clamp(20px,4.5vw,34px)}
.game{background:var(--card);border:2px solid var(--ones);border-radius:14px;padding:18px;margin-top:14px;text-align:center}
.gnum{direction:ltr;font-family:var(--display);font-size:clamp(34px,9vw,56px);letter-spacing:.04em;margin:6px 0 2px}
.gnum mark{background:var(--hl);color:var(--fg);border-radius:8px;padding:0 6px;outline:3px solid var(--mill)}
.gq{font-weight:700;margin-bottom:10px}
.gopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:480px;margin:0 auto}
.gopts .opt{justify-content:center;font-family:var(--display);font-size:22px;direction:ltr}
.gtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
footer{margin-top:50px;color:var(--muted);font-size:14px;text-align:center}
@media (max-width:520px){body{font-size:16px}.opt{font-size:16px}table.pv .dg td{font-size:24px}}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
@media print{
  body{background:#fff;color:#000;font-size:14px}
  nav.jump,.btn,.tool,.row,#quiz,#game,#cards .row{display:none!important}
  section{page-break-inside:avoid;margin-top:24px}
  #worksheet{page-break-before:always}
  td.ans:not(.on){color:inherit;background:none}
  td.ans:not(.on)::after{content:""}
}
</style>
<style>
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.4}
.brand b{font-family:var(--display);font-size:clamp(26px,5vw,38px);color:var(--ones)}
.brand span{color:var(--muted);font-size:15px}
nav.main{display:flex;gap:8px;flex-wrap:wrap}
nav.main button{font-family:var(--body);font-weight:700;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 16px;cursor:pointer}
nav.main button.on{border-color:var(--ones);background:var(--ones-bg);color:var(--ones)}
nav.main button:focus-visible{outline:3px solid var(--ones)}
.hello{background:var(--ones);color:var(--on-accent);border-radius:16px;padding:22px 24px;margin-top:18px}
.hello h1{color:var(--on-accent);font-size:clamp(28px,6vw,44px)}
.hello p{margin:6px 0 0;max-width:56ch;opacity:.95}
.grades{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.sub{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--ones);border-radius:12px;padding:14px 16px;text-align:start;font-family:var(--body);color:var(--fg);cursor:pointer;width:100%}
.sub h3{margin:0 0 4px;color:inherit}
.sub.soon{opacity:.7;cursor:default;border-top-color:var(--line)}
.sub small{display:block;color:var(--muted);font-size:14px}
.sub:not(.soon):hover{border-color:var(--ones)}
.sub:focus-visible{outline:3px solid var(--ones)}
.nameBox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.nameBox input{flex:1;min-width:200px;font-family:var(--body);font-size:18px;text-align:start;direction:rtl;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.nameBox input:focus-visible{outline:3px solid var(--ones);border-color:var(--ones)}
.unit{margin-top:22px}
.unit h3{margin:0 0 6px}
.lrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-top:8px;width:100%;font-family:var(--body);font-size:17px;color:var(--fg);cursor:pointer;text-align:start}
.lrow:hover{border-color:var(--ones)}
.lrow:focus-visible{outline:3px solid var(--ones)}
.lrow .meter{width:110px;flex:none}
.goback{background:none;border:0;color:var(--ones);font-family:var(--body);font-weight:700;font-size:16px;cursor:pointer;padding:0;margin-top:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{font-family:var(--body);font-weight:700;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--ones);border-color:var(--ones);color:var(--on-accent)}
.tabs button:focus-visible{outline:3px solid var(--fg)}
.ptw{margin:10px 0;padding-inline-start:22px}
.ptw li{margin:8px 0}
.fc{perspective:1000px;max-width:560px;margin:14px auto 0}
.fc-in{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid var(--ones)}
.front{background:var(--card)} .back{background:var(--ones);color:var(--on-accent);transform:rotateY(180deg)}
.face .k{font-size:14px;opacity:.8;margin-bottom:6px}
.face .t{font-family:var(--display);font-size:clamp(20px,4.6vw,28px);line-height:1.6}
.hint{margin-top:10px;background:var(--hl);color:var(--fg);border-radius:10px;padding:4px 14px;font-size:16px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.btn.no{background:var(--mill);border-color:var(--mill);color:var(--on-accent)}
.opt.sel{border-color:var(--ones);background:var(--ones-bg)}
.stage{background:var(--card);border:2px solid var(--ones);border-radius:16px;padding:18px;margin-top:12px;text-align:center}
.stage .pr{font-weight:700;font-size:20px}
.big{direction:ltr;font-family:var(--display);font-size:clamp(30px,8vw,54px);line-height:1.5;margin:4px 0}
.big mark{background:var(--hl);color:var(--fg);border-radius:8px;padding:0 6px;outline:3px solid var(--mill)}
.gopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:520px;margin:12px auto 0}
.gopts .opt{justify-content:center;font-family:var(--display);font-size:22px;direction:ltr}
.hearts{color:var(--bad);font-size:24px;letter-spacing:4px;direction:ltr}
.stars{font-size:42px;color:var(--mill);letter-spacing:6px;direction:ltr}
.hero2{font-family:var(--display);font-size:clamp(24px,6vw,36px);color:var(--ones)}
.lyrics{max-width:560px;margin:14px auto 0}
.lyrics p{margin:6px 0;padding:8px 16px;border-radius:12px;font-family:var(--display);font-size:clamp(20px,4.6vw,26px);line-height:1.7;text-align:center;border:2px solid transparent;transition:.2s}
.lyrics p.now{background:var(--hl);border-color:var(--mill)}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.note{background:var(--hl);border-radius:10px;padding:8px 14px;margin-top:12px;font-size:15px}
.fbx{margin-top:12px;text-align:start}
table.res{border-collapse:collapse;width:100%;min-width:620px;margin-top:10px}
table.res th,table.res td{border:1px solid var(--line);padding:6px 10px;text-align:start}
table.res th{background:var(--ones-bg);color:var(--ones)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpis b{display:block;font-family:var(--display);font-size:30px;color:var(--ones)}
a.wa{display:inline-block;text-decoration:none;background:#1a7f43;color:#fff;font-weight:700;font-size:17px;padding:10px 22px;border-radius:12px}
.pillbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pillbar i{display:block;height:100%;background:var(--thou)}
.det{border-inline-start:6px solid var(--line);padding:8px 14px;margin:10px 0;border-radius:8px;background:var(--card)}
.det.ok{border-color:var(--ok);background:var(--ok-bg)} .det.no{border-color:var(--bad);background:var(--bad-bg)}
@media (prefers-reduced-motion: reduce){.fc-in,.lyrics p{transition:none}}
.goback{background:none;border:0;color:var(--ones);font-family:var(--body);font-weight:700;font-size:16px;cursor:pointer;padding:0;margin-top:18px}
.lbl{display:block;font-weight:700;margin:14px 0 4px}
.fld{width:100%;font-family:var(--body);font-size:17px;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);text-align:start;direction:rtl}
.fld.ltr,.ltr{direction:ltr;text-align:left}
textarea.fld{line-height:1.7;resize:vertical}
.fld:focus-visible{outline:3px solid var(--ones);border-color:var(--ones)}
.authbox{max-width:480px;margin-inline:auto}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin-top:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.muted{color:var(--muted);font-size:15px}
.txtopt{font-family:var(--body);font-size:18px;direction:rtl;line-height:1.6}
.gopts .opt.tx{direction:rtl;font-family:var(--body)}
.stu{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"d n m" "d p p";gap:4px 12px;align-items:center;width:100%;text-align:start;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;font-family:var(--body);font-size:16px;cursor:pointer}
.stu:hover{border-color:var(--ones)} .stu:focus-visible{outline:3px solid var(--ones)}
.stu.off{opacity:.65}
.stu .dot{grid-area:d;width:12px;height:12px;border-radius:50%;background:var(--line)}
.stu .dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}
.stu .dot.bl{background:var(--bad)}
.stu .sn{grid-area:n;display:flex;flex-direction:column;line-height:1.5;min-width:0}
.stu .sn small{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.stu .sm{grid-area:m;display:flex;flex-direction:column;align-items:flex-end;line-height:1.5}
.stu .sm small,.stu .sp small{color:var(--muted)}
.stu .sp{grid-area:p;display:flex;flex-direction:column;gap:2px}
.lvl{display:inline-block;font-weight:700;font-size:14px;padding:0 12px;border-radius:99px;border:2px solid currentColor}
.lv0{color:var(--muted)} .lv1{color:var(--mill)} .lv2{color:var(--thou)} .lv3{color:var(--ok)} .lv4{color:var(--bad)}

<script>
var NUMRE=/\d(?:[\d,]*\d)?(?:\s*[+−×÷=-]\s*\d(?:[\d,]*\d)?)*/g;
function numify(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode;
    if(!p||/^(SCRIPT|STYLE|BDI|INPUT|TEXTAREA)$/.test(p.nodeName)||(p.closest&&p.closest("bdi"))) return NodeFilter.FILTER_REJECT;
    return /\d/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  var nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(function(n){
    var t=n.nodeValue; NUMRE.lastIndex=0;
    var frag=document.createDocumentFragment(),last=0,m;
    while((m=NUMRE.exec(t))){
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      var b=document.createElement("bdi"); b.className="num"; b.textContent=m[0]; frag.appendChild(b);
      last=NUMRE.lastIndex;
    }
    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    n.parentNode.replaceChild(frag,n);
  });
}

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(n){return Number(n).toLocaleString("en-US");}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}

addLesson("L1","math-4","القيمة المكانية","value",
 ["كل ثلاث خانات تكوّن فئة: الآحاد ثم الآلاف ثم الملايين، وتفصل بينها فاصلة.","نعدّ الخانات من اليمين: آحاد، عشرات، مئات، آلاف، عشرات الآلاف، مئات الآلاف، ملايين.","قيمة الرقم = الرقم × قيمة خانته، والرقم ثابت لكن قيمته تتغير بمكانه.","كل خانة تساوي 10 أمثال الخانة التي على يمينها.","الصفر يحجز المكان فلا نحذفه، والعدد يُكتب بثلاث صيغ: قياسية ولفظية وممتدة."],
 "في العدد 3,704,215 الرقم 7 في خانة مئات الآلاف، فقيمته 700,000.",
 [["ما الفئة؟","كل ثلاث خانات متجاورة وتفصل بين الفئات فاصلة.","ثلاثة ثلاثة من اليمين"],["كيف نحسب قيمة الرقم؟","الرقم × قيمة خانته.","اضرب الرقم في خانته"],["ما وظيفة الصفر؟","يحجز مكان الخانة الخالية ولا يُحذف.","قارن 4,003 و 43"],["ما الصيغة الممتدة؟","مجموع قيم الأرقام: 40,000 + 5,000 + 300 + 2.","اجمع القيم"],["ما 10 أمثال 4,500؟","45,000","اضرب في 10"],["ما قيمة 6 في 2,650,000؟","600,000","بعد الملايين"]],
 [["ما قيمة الرقم 7 في العدد 3,704,215؟","700,000","70,000","7,000","7,000,000","الرقم 7 في خانة مئات الآلاف، فقيمته 7 × 100,000."],
  ["ما الرقم في خانة الآلاف في العدد 6,482,953؟","2","4","8","9","نعدّ من اليمين: 3 آحاد، 5 عشرات، 9 مئات، ثم 2 في الآلاف."],
  ["اكتب بالأرقام: ثلاثة ملايين وخمسمائة ألف وأربعون","3,500,040","3,500,400","3,050,040","3,540,000","3,000,000 + 500,000 + 40 ونملأ الخانات الخالية بأصفار."],
  ["ما الصيغة الممتدة للعدد 45,302؟","40,000 + 5,000 + 300 + 2","40,000 + 5,000 + 30 + 2","4,000 + 500 + 300 + 2","40,000 + 500 + 30 + 2","كل رقم × قيمة خانته، والعشرات صفر فلا تظهر."],
  ["ما 10 أمثال العدد 4,500؟","45,000","4,510","450","450,000","نضرب في 10 فينتقل كل رقم خانة إلى اليسار."],
  ["ما العدد الذي قبل 100,000 مباشرة؟","99,999","99,990","90,000","100,001","العدد السابق = العدد − 1."],
  ["ما أكبر عدد من الأرقام 3 ، 8 ، 0 ، 6 ، 1 دون تكرار؟","86,310","86,301","83,610","13,068","نرتب الأرقام تنازليًا: 8 ثم 6 ثم 3 ثم 1 ثم 0."],
  ["في العدد 2,050,360 ما قيمة الرقم 5؟","50,000","5,000","500,000","5","الرقم 5 في خانة عشرات الآلاف فقيمته 5 × 10,000."]],
 {t:"نشيد الخانات",l:["آحادٌ وعشراتٌ ومئاتْ","ثلاثٌ ثلاثٌ هذي الفئاتْ","ثم الآلافُ وفوقها الملايينْ","نعدُّ من اليمينِ يا مجتهدينْ","الرقمُ ثابتٌ وقيمتُهُ تتغيرْ","والصفرُ يحجزُ المكانَ ولا يتغيرْ"]});

addLesson("L2","math-4","التقريب","round",

 [["قرّب 3,846 لأقرب عشرة","3,850","3,840","3,800","3,900","رقم الآحاد 6 أكبر من 5 فنزيد العشرات 1."],
  ["قرّب 7,350 لأقرب مئة","7,400","7,300","7,350","8,000","رقم العشرات 5 فنزيد المئات 1 ونصفّر ما بعدها."],
  ["قرّب 28,499 لأقرب ألف","28,000","29,000","28,500","28,400","رقم المئات 4 أقل من 5 فتبقى خانة الآلاف كما هي."],
  ["قرّب 65,000 لأقرب عشرة آلاف","70,000","60,000","65,000","66,000","رقم الآلاف 5 فنزيد عشرات الآلاف 1."],
  ["قرّب 4,449 لأقرب مئة","4,400","4,500","4,450","4,000","رقم العشرات 4 أقل من 5 فتبقى المئات 4."],
  ["قرّب 999 لأقرب عشرة","1,000","990","900","1,010","رقم الآحاد 9 يرفع العشرات فتتحول إلى 1,000."],

  ["قدّر ناتج 4,812 + 3,196 لأقرب ألف","8,000","9,000","7,000","7,900","نقرّب 4,812 إلى 5,000 و 3,196 إلى 3,000 والمجموع 8,000."]],
 {t:"نشيد التقريب",l:["أنظرُ إلى الجارِ الأيمنْ","خمسةٌ فأكثرُ ارفعْ يا فطنْ","أقلُّ من خمسةٍ اتركْ ولا تقلقْ","وما بعدَ الخانةِ صفِّرْ وانطلقْ","التقريبُ يُسهِّلُ الحسابْ","ويُريكَ الناتجَ دونَ عذابْ"]});

  ["ما الترتيب التصاعدي للأعداد 9,540 ، 9,045 ، 9,504 ، 9,450؟","9,045 ، 9,450 ، 9,504 ، 9,540","9,540 ، 9,504 ، 9,450 ، 9,045","9,045 ، 9,504 ، 9,450 ، 9,540","9,450 ، 9,045 ، 9,504 ، 9,540","نقارن المئات ثم العشرات: 9,045 ثم 9,450 ثم 9,504 ثم 9,540."],

addLesson("L4","math-4","الجمع والطرح مع إعادة التسمية","addsub",
 ["رتّب الأعداد بحيث تتقابل الخانات، وابدأ من الآحاد.","في الجمع: إذا زاد مجموع الخانة عن 9 نكتب رقم الآحاد منه ونحمل العشرة للخانة التالية.","في الطرح: إذا كان الرقم العلوي أصغر نستلف 1 من الخانة التي على يساره فيصبح 10 في خانتنا.","للتحقق: الناتج + العدد المطروح = العدد الأصلي."],

  ["اشترى البطل قلمًا بـ 15 جنيهًا وكراسة بـ 25 جنيهًا ودفع 100 جنيه. كم بقي معه؟","60 جنيهًا","40 جنيهًا","75 جنيهًا","85 جنيهًا","ما اشتراه 15 + 25 = 40، والباقي 100 − 40 = 60."],

 {t:"نشيد الجمع والطرح",l:["نرتّبُ الخاناتِ تحتَ بعضْ","ونبدأُ بالآحادِ بلا رفضْ","لو زادتْ عن تسعةٍ نحملْ","ولو نقصتْ في الطرحِ نستلفْ","ونتحققُ بالعكسِ بإتقانْ","فالناتجُ صحيحٌ بكلِّ أمانْ"]});

 {t:"نشيد القياس",l:["كيلو ألفُ متْرٍ يا صديقي","وكيلوجرامٌ ألفُ جرامٍ بطريقي","واللترُ ألفُ مللي وسعةْ","والساعةُ ستونَ دقيقةً ببراعةْ","كبيرةٌ إلى صغيرةٍ نضربْ","وصغيرةٌ إلى كبيرةٍ نقسمْ ونُعربْ"]});

addLesson("L5","math-4","المحيط والمساحة","geom",

function pick4(correct,cands,pad){
  var seen={};seen[correct]=1;var out=[];
  shuffle(cands.slice()).forEach(function(c){if(c>0&&Math.floor(c)===c&&!seen[c]){seen[c]=1;out.push(c);}});
  var g=0;while(out.length<3&&g++<60){var c2=pad();if(c2>0&&Math.floor(c2)===c2&&!seen[c2]){seen[c2]=1;out.push(c2);}}
  return shuffle([correct].concat(out.slice(0,3)));
}

var P={name:"",lessons:{}};

var ZERO={cards:0,practice:0,test:0,game:0,song:0};
function LPr(id){return P.lessons[id]||ZERO;}
function LP(id){if(!P.lessons[id])P.lessons[id]={cards:0,practice:0,test:0,game:0,song:0};return P.lessons[id];}
function pctFor(L,p){
  var req=[];
  if(L.cards&&L.cards.length)req.push(p.cards);
  if(L.quiz&&L.quiz.length){req.push(p.practice);req.push(p.test);}
  if(L.gen!=="none"&&(L.gen!=="quiz"||(L.quiz&&L.quiz.length)))req.push(p.gameDone);
  if(L.song&&L.song.l&&L.song.l.length)req.push(p.song);
  if(!req.length)return 0;
  var n=0;req.forEach(function(x){if(x)n++;});return Math.round(n/req.length*100);
}
function pct(id){return LESSONS[id]?pctFor(LESSONS[id],LPr(id)):0;}

  var ed=editId?CUSTOM_RAW.filter(function(d){return d.id===editId;})[0]:null;
  var h='<h2>'+(ed?"تعديل درس":"إضافة درس جديد")+'</h2><div class="note" style="margin-top:12px">اكتبي الدرس هنا وسيظهر للطلاب فورًا. أي قسم تتركينه فارغًا لن يظهر للطالب (مثلًا لو لم تكتبي أسئلة لن يظهر التدريب والاختبار).</div><div class="card form">';
  h+='<div class="two"><div><label class="lbl" for="f_sub">المادة</label><select class="fld" id="f_sub">'+SUBJECTS.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join("")+'</select></div><div><label class="lbl" for="f_gr">الصف</label><select class="fld" id="f_gr">'+GRADES.map(function(g,i){return '<option value="'+(i+1)+'">الصف '+g+'</option>';}).join("")+'</select></div></div>';
  h+='<label class="lbl" for="f_un">اسم الوحدة (اكتبي اسم وحدة موجودة لتضاف إليها، أو اسمًا جديدًا)</label><input class="fld" id="f_un" type="text" list="f_unl" placeholder="مثال: الوحدة السادسة: الكسور"><datalist id="f_unl"></datalist>';
  h+='<label class="lbl" for="f_ti">عنوان الدرس</label><input class="fld" id="f_ti" type="text" placeholder="مثال: الكسور العادية">';
  h+='<label class="lbl" for="f_pts">الشرح: كل سطر نقطة مستقلة</label><textarea class="fld" id="f_pts" rows="5" placeholder="الكسر جزء من الكل.&#10;البسط هو العدد الأعلى."></textarea>';
  h+='<label class="lbl" for="f_ex">مثال محلول (اختياري)</label><input class="fld" id="f_ex" type="text" placeholder="مثال: ثلاثة أرباع = 3/4">';
  h+='<div class="two"><div><label class="lbl" for="f_lk">رابط شرائح أو ملف (اختياري)</label><input class="fld ltr" id="f_lk" type="url" placeholder="https://..."></div><div><label class="lbl" for="f_ll">اسم الزر</label><input class="fld" id="f_ll" type="text" placeholder="شاهد الشرائح"></div></div>';
  h+='<label class="lbl" for="f_cd">البطاقات: كل سطر بطاقة بهذا الشكل:  السؤال | الإجابة | تلميح</label><textarea class="fld" id="f_cd" rows="4" placeholder="ما البسط؟ | العدد الأعلى في الكسر | ينظر إلى الأعلى"></textarea>';
  h+='<label class="lbl" for="f_qz">الأسئلة: كل سطر سؤال بهذا الشكل:  السؤال | الإجابة الصحيحة | خطأ 1 | خطأ 2 | خطأ 3 | التفسير</label><textarea class="fld" id="f_qz" rows="6" placeholder="ما بسط الكسر 3/4؟ | 3 | 4 | 7 | 1 | البسط هو العدد الأعلى"></textarea>';
  h+='<label class="lbl" for="f_gn">اللعبة</label><select class="fld" id="f_gn">'+GENN.map(function(g){return '<option value="'+g[0]+'">'+g[1]+'</option>';}).join("")+'</select>';
  h+='<div class="two"><div><label class="lbl" for="f_st">عنوان النشيد (اختياري)</label><input class="fld" id="f_st" type="text" placeholder="نشيد الكسور"></div></div><label class="lbl" for="f_sl">كلمات النشيد: كل سطر جملة</label><textarea class="fld" id="f_sl" rows="4"></textarea>';
  h+='<div class="err" id="f_err" role="alert"></div><div class="row"><button class="btn" id="f_save">'+(ed?"حفظ التعديلات":"نشر الدرس للطلاب")+'</button>'+(ed?'<button class="btn ghost" id="f_cancel">إلغاء التعديل</button>':"")+'</div></div>';
  h+='<h2>الدروس التي أضفتِها</h2><div id="f_list"></div>';
  setView(h);
  function fillUnits(){var seen={};var dl=$("f_unl");dl.innerHTML="";var k=$("f_sub").value+"-"+$("f_gr").value;if(COURSES[k])COURSES[k].units.forEach(function(u){if(!seen[u.t]){seen[u.t]=1;var o=document.createElement("option");o.value=u.t;dl.appendChild(o);}});}
  $("f_sub").value="math";$("f_gr").value=String(curGrade);
  $("f_sub").addEventListener("change",fillUnits);$("f_gr").addEventListener("change",fillUnits);fillUnits();
  if(ed){var pp=(ed.course||"math-4").split("-");$("f_sub").value=pp[0];$("f_gr").value=pp[1];fillUnits();
    $("f_un").value=ed.unitTitle||"";$("f_ti").value=ed.title||"";$("f_pts").value=(ed.pts||[]).join("\n");$("f_ex").value=ed.ex||"";$("f_lk").value=ed.link||"";$("f_ll").value=ed.linkLabel||"";
    $("f_cd").value=(ed.cards||[]).map(function(c){return [c.q,c.a,c.h||""].join(" | ");}).join("\n");
    $("f_qz").value=(ed.quiz||[]).map(function(q){return [q.q,q.c,q.w1,q.w2,q.w3,q.why||""].join(" | ");}).join("\n");
    $("f_gn").value=ed.gen||"quiz";$("f_st").value=(ed.song&&ed.song.t)||"";$("f_sl").value=((ed.song&&ed.song.l)||[]).join("\n");
    $("f_cancel").addEventListener("click",function(){viewAdd();});}
  function err(t){$("f_err").textContent=t;if(t)$("f_err").scrollIntoView({block:"center"});}
  $("f_save").addEventListener("click",function(){
    err("");
    var title=$("f_ti").value.trim(),unit=$("f_un").value.trim(),pts=parseLines($("f_pts").value);
    if(!title)return err("اكتبي عنوان الدرس.");
    if(!unit)return err("اكتبي اسم الوحدة.");
    if(!pts.length)return err("اكتبي نقطة واحدة على الأقل في الشرح.");
    var link=$("f_lk").value.trim();if(link&&!safeUrl(link))return err("الرابط لازم يبدأ بـ https://");
    var cards=[],cl=parseLines($("f_cd").value);
    for(var i=0;i<cl.length;i++){var c=cl[i].split("|").map(function(x){return x.trim();});if(c.length<2||!c[0]||!c[1])return err("البطاقة رقم "+(i+1)+": اكتبي السؤال ثم | ثم الإجابة.");cards.push({q:c[0],a:c[1],h:c[2]||""});}
    var quiz=[],ql=parseLines($("f_qz").value);
    for(var j=0;j<ql.length;j++){var q=ql[j].split("|").map(function(x){return x.trim();});
      if(q.length<5||q.slice(0,5).some(function(x){return !x;}))return err("السؤال رقم "+(j+1)+": لازم السؤال ثم الإجابة الصحيحة ثم 3 إجابات خاطئة، يفصل بينها |");
      if(new Set(q.slice(1,5)).size<4)return err("السؤال رقم "+(j+1)+": الإجابات الأربع لازم تكون مختلفة.");
      quiz.push({q:q[0],c:q[1],w1:q[2],w2:q[3],w3:q[4],why:q[5]||""});}
    var gen=$("f_gn").value;if(gen==="quiz"&&!quiz.length)gen="none";
    var sl=parseLines($("f_sl").value),song=sl.length?{t:$("f_st").value.trim()||"نشيد الدرس",l:sl}:null;
    var id=ed?ed.id:("C"+Date.now().toString(36));
    var obj={id:id,course:$("f_sub").value+"-"+$("f_gr").value,unitTitle:unit,title:title,pts:pts,ex:$("f_ex").value.trim(),link:link,linkLabel:$("f_ll").value.trim(),cards:cards,quiz:quiz,gen:gen,song:song,createdAt:ed?(ed.createdAt||Date.now()):Date.now()};
    $("f_save").disabled=true;
    fs.doc("lessons/"+id).set(obj).then(function(){toast("تم نشر الدرس وظهر للطلاب ✅");viewAdd();},function(e){$("f_save").disabled=false;err(arErr(e));});
  });
  var lst=$("f_list");
  if(!CUSTOM_RAW.length)lst.innerHTML='<div class="card">لم تضيفي دروسًا بعد.</div>';
  else{lst.innerHTML=CUSTOM_RAW.map(function(d){return '<div class="det"><div class="row" style="margin:0;justify-content:space-between"><span><b>'+esc(d.title)+'</b><br><small>'+esc((COURSES[d.course]&&COURSES[d.course].title)||d.course)+' · '+esc(d.unitTitle||"")+'</small></span><span class="row" style="margin:0"><button class="btn ghost" data-e="'+d.id+'">تعديل</button><button class="btn ghost" data-d="'+d.id+'">حذف</button></span></div></div>';}).join("");
    lst.querySelectorAll("[data-e]").forEach(function(b){b.addEventListener("click",function(){viewAdd(b.dataset.e);});});
    lst.querySelectorAll("[data-d]").forEach(function(b){var armed=false;b.addEventListener("click",function(){if(!armed){armed=true;b.textContent="اضغطي للتأكيد";return;}fs.doc("lessons/"+b.dataset.d)["delete"]().then(function(){toast("تم حذف الدرس");},function(e){toast(arErr(e));});});});}
}

route();

</script>
</body>
</html>
